services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sutramind
      POSTGRES_USER: sutramind
      POSTGRES_PASSWORD: sutramind_local_only
    ports:
      - "5432:5432"
    volumes:
      - sutramind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutramind -d sutramind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sutramind_pgdata:

