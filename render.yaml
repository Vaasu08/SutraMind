services:
  - type: web
    name: sutramind-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONPATH
        value: backend
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: DATABASE_URL
        value: sqlite:///./sutramind.db
